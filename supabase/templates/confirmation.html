<!doctype html>
<html lang="es-CO">
  <body style="margin:0;padding:0;background:#F8F5EA;font-family:'Source Sans 3',Arial,sans-serif;color:#242824;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F8F5EA;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#FDFCF7;border-radius:24px;padding:32px;">
            <tr>
              <td>
                <p style="margin:0 0 24px;font-family:Manrope,Arial,sans-serif;font-size:24px;font-weight:800;color:#174C3C;">Salvori</p>
                <h1 style="margin:0 0 12px;font-family:Manrope,Arial,sans-serif;font-size:22px;font-weight:800;color:#174C3C;">Confirma tu correo</h1>
                <p style="margin:0 0 24px;font-size:16px;line-height:1.5;">Bienvenido a Salvori. Toca el botón para confirmar tu correo y entrar.</p>
                <p style="margin:0 0 24px;">
                  <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email"
                     style="display:inline-block;background:#174C3C;color:#F8F5EA;text-decoration:none;font-family:Manrope,Arial,sans-serif;font-weight:700;padding:14px 28px;border-radius:999px;">Confirmar y entrar</a>
                </p>
                <p style="margin:0 0 8px;font-size:14px;color:#56605A;">El enlace sirve una sola vez y vence en 1 hora. Si no lo pediste, ignora este correo.</p>
                <p style="margin:24px 0 0;font-size:14px;color:#56605A;">Lo bueno se aprovecha. · Popayán</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
